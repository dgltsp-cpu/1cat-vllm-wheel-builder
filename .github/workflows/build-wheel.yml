name: Build 1Cat-vLLM SM70 wheel

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "1Cat-vLLM ref to build (tag, branch or commit)"
        type: string
        required: true
        default: "v1.5.0"
      version:
        description: "Force the wheel version (empty = derive from git via setuptools-scm)"
        type: string
        required: false
        default: ""
      max_jobs:
        description: "Parallel compile jobs"
        type: string
        required: true
        default: "4"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Disk before build
        run: df -h /

      - name: Checkout builder repository
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout 1Cat-vLLM
        uses: actions/checkout@v4
        with:
          repository: 1CatAI/1Cat-vLLM
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          path: src

      - name: Resolved source revision
        working-directory: src
        run: |
          git log -1 --format='commit %H%ndate   %cI%nsubject %s'
          git describe --tags --always || true

      - name: Pull CUDA 12.8 devel image
        run: docker pull nvidia/cuda:12.8.1-devel-ubuntu24.04

      - name: Build wheel
        env:
          BUILD_REF: ${{ inputs.ref }}
          MAX_JOBS: ${{ inputs.max_jobs }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          mkdir -p out
          chmod +x builder/ci/*.sh
          docker run --rm \
            -v "$PWD/src:/work/src" \
            -v "$PWD/builder:/work/builder" \
            -v "$PWD/out:/work/out" \
            -e BUILD_REF -e MAX_JOBS -e VERSION_OVERRIDE \
            nvidia/cuda:12.8.1-devel-ubuntu24.04 \
            bash /work/builder/ci/build-in-container.sh

      - name: Verify wheel
        run: bash builder/ci/verify-wheel.sh out

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 1cat-vllm-wheel
          path: |
            out/*.whl
            out/*.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WHEEL="$(ls out/*.whl | head -n1)"
          SHAFILE="$(ls out/*.sha256 | head -n1)"
          NAME="$(basename "$WHEEL")"
          SUM="$(cut -d' ' -f1 "$SHAFILE")"
          COMMIT="$(git -C src rev-parse HEAD)"
          SHORT="$(git -C src rev-parse --short HEAD)"
          REF="$(echo "${{ inputs.ref }}" | tr '/' '-')"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TAG="wheel-${REF}-${SHORT}"

          sed -e "s|{{REF}}|${{ inputs.ref }}|g" \
              -e "s|{{COMMIT}}|$COMMIT|g" \
              -e "s|{{WHEEL}}|$NAME|g" \
              -e "s|{{SHA256}}|$SUM|g" \
              -e "s|{{RUN_URL}}|$RUN_URL|g" \
              builder/ci/release-notes.md > /tmp/release-notes.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists, replacing its assets"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$WHEEL" "$SHAFILE"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "1Cat-vLLM SM70 wheel - ${{ inputs.ref }} @ $SHORT" \
              --notes-file /tmp/release-notes.md --latest \
              "$WHEEL" "$SHAFILE"
          fi
          echo "release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
